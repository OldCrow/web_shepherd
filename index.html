<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>webShepherd</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<canvas id="m-a_s"></canvas>

<footer id="repo-link">
  <div id="mode-link-full" class="mode-link full-only">
    <a href="?mode=slim"> > slim</a>
  </div>
  <div id="mode-link-slim" class="mode-link slim-only">
    <a href="./"> > full</a>
  </div>
  <a href="https://github.com/tjards/web_shepherd" target="_blank">repo</a>
</footer>

<script>
// Mode detection (slim vs full) - must run before config.js
const params = new URLSearchParams(window.location.search);
const APP_MODE = params.get('mode') === 'slim' ? 'slim' : 'full';
const isSlim = APP_MODE === 'slim';
// Apply CSS class for mode-specific styling
document.body.classList.toggle('slim', isSlim);

// When slim mode is embedded in an iframe, hide the full-mode link so the
// host page stays clean; standalone slim keeps a way back to full mode.
if (isSlim && window.self !== window.top) {
  document.addEventListener('DOMContentLoaded', () => {
    const modeLinkSlim = document.getElementById('mode-link-slim');
    if (modeLinkSlim) {
      modeLinkSlim.style.display = 'none';
    }
  });
}
</script>
<script src="config.js"></script>
<script src="vector-math.js"></script>
<script src="spatial-grid.js"></script>
<script src="agent.js"></script>
<script src="agent_herd.js"></script>
<script src="agent_shepherd.js"></script>
<script src="simulation-core.js"></script>
<script src="renderer.js"></script>
<script src="ui.js"></script>
<script>

// canvas setup
const canvas  = document.getElementById('m-a_s');
const ctx     = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// initialize agents
const centerX = canvas.width/2;
const centerY = canvas.height/2;

const herd = {
  members: [],
  color: COLORS.HERD,
  label: 'Herd'
};
herd.members = initializeHerd(INIT.HERD_SIZE, centerX, centerY, INIT.HERD_SPREAD_RADIUS);

const shepherds = {
  members: [],
  color: COLORS.SHEPHERD,
  label: 'Shepherds'
};
shepherds.members = initializeShepherds(INIT.SHEPHERD_SIZE, centerX, centerY, canvas.height);

// track population sizes for UI updates
let herdSize = INIT.HERD_SIZE;
let shepherdSize = INIT.SHEPHERD_SIZE;

// wrappers for dynamic UI controls
function addRandomHerdMember() {
  _addRandomHerdMember(herd.members, canvas.width, canvas.height);
}
function removeRandomHerdMember() {
  _removeRandomHerdMember(herd.members);
}
function addRandomShepherd() {
  _addRandomShepherd(shepherds.members, canvas.width, canvas.height);
}
function removeRandomShepherd() {
  _removeRandomShepherd(shepherds.members);
}

// start the app
initUI(canvas, ctx);

</script>
</body>
</html>
